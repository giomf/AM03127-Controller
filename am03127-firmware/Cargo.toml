[workspace]
resolver = "2"

[package]
edition = "2024"
name    = "am03127-firmware"
version = "0.1.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[dependencies]
am03127-commands = { path = "../am03127-commands" }
critical-section = "1.2.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10" }
embassy-futures = "0.1"
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-sync = { version = "0.8.0", features = ["log"] }
embassy-time = { version = "0.5.1" }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.2"
embedded-storage-async = "0.4.2"
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c3", "embedded-storage"] }
esp-hal = { version = "1.2.2", features = ["esp32c3", "unstable", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp32c3",
  "log-04",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.4.0", features = ["esp32c3", "embassy", "esp-radio"] }
esp-storage = { version = "0.10.0", features = ["esp32c3", "embedded-storage"] }
log = { version = "0.4.35" }
picoserve = { version = "0.20.1", features = ["alloc", "embassy", "log", "json"] }
sequential-storage = { version = "8.0.2", features = ["alloc", "postcard"] }
serde = { version = "1.0.229", features = ["derive", "alloc"], default-features = false }
sntpc = { version = "0.11.0", default-features = false, optional = true }
sntpc-net-embassy = { version = "0.11.0", default-features = false, optional = true }
static_cell = "2.1.1"
time = { version = "0.3.55", features = [ "macros" ], default-features = false, optional = true }


[build-dependencies]
time = { version = "0.3.55", features = ["std"] }

[features]
default = [ "web_interface" ]
web_interface = []
sntp = ["dep:sntpc", "dep:sntpc-net-embassy", "dep:time"]
